[package]
name = "lackminer-qbtc"
version = "0.2.1"
edition = "2021"

[dependencies]
sha2 = { version = "0.10.8", features = ["compress"] }
serde_json = "1.0"
libloading = "0.8"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3.3"
bech32 = "0.9.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1


[dependencies.ctrlc]
version = "3.4"
features = ["termination"]
